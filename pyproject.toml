[project]
name = "cm-agents"
version = "0.1.0"
description = "Agentic change, release, and deployment management on a ServiceNow PDI"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "httpx>=0.27",
    "langchain-xai>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
]

[project.scripts]
cm-agents = "cm_agents.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cm_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Plain `pytest` stays offline. `pytest -m live` runs the tests that need the PDI or the LLM.
addopts = "-m 'not live'"
markers = ["live: needs the ServiceNow PDI or the LLM"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
